name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test, build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `ray build` generates raycast-env.d.ts (gitignored) and runs the full
      # TypeScript check, so this is the typecheck step as well as the build.
      - name: Build (includes TypeScript check)
        run: npx ray build -e dist

      # `ray lint` is not used here on purpose: its package.json validation
      # calls Raycast's API to verify the author handle, which depends on
      # store-account state rather than this repository's code. Run the same
      # deterministic checks it wraps — ESLint (src, matching ray lint's
      # scope) and Prettier — directly instead.
      - name: ESLint
        run: npx eslint src

      - name: Prettier
        run: npx prettier --check src tests
